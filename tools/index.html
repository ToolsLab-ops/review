<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolsLab. — 無料ツール（新レイアウト v2）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --white:   #FFFFFF;
  --bg:      #F8FAFC;
  --border:  #E2E8F0;
  --text:    #1E293B;
  --muted:   #64748B;
  --blue:    #2563EB;
  --blue-lt: #DBEAFE;
  --blue-md: #BFDBFE;
  --red:     #DC2626;
  --radius:  12px;
  --shadow:  0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.06);
  --header-h: 56px;
  --filter-h: 46px;
  --sidebar-w: 290px;
}
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }

/* ===== HEADER ===== */
.site-header {
  height: var(--header-h); background: var(--white);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 300;
}
.hdr-inner {
  max-width: 100%; padding: 0 20px; height: 100%;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 6px; text-decoration: none; }
.logo-badge { background: var(--blue); color: #fff; font-size: .6rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
.logo-text { font-size: 1.05rem; font-weight: 900; color: var(--text); }
.logo-dot { color: var(--blue); }
.site-nav { display: flex; gap: 4px; }
.site-nav a { color: var(--muted); text-decoration: none; font-size: .82rem; font-weight: 600; padding: 5px 12px; border-radius: 8px; }
.site-nav a.active { background: var(--blue-lt); color: var(--blue); }

/* ===== FILTER BAR ===== */
.filter-bar-wrap {
  height: var(--filter-h); background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky; top: var(--header-h); z-index: 200;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.filter-bar {
  height: 100%; padding: 0 12px;
  display: flex; align-items: center; gap: 6px;
  overflow-x: auto; scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn {
  flex-shrink: 0; background: var(--bg); border: 1.5px solid var(--border);
  color: var(--muted); font-size: .75rem; font-weight: 700;
  padding: 5px 13px; border-radius: 9999px; cursor: pointer;
  font-family: inherit; white-space: nowrap; transition: all .15s;
}
.filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.28); }

/* ===== MAIN LAYOUT (Desktop: 2-col, Mobile: 1-col) ===== */
.tools-layout {
  display: grid;
  grid-template-columns: 1fr var(--sidebar-w);
  min-height: calc(100vh - var(--header-h) - var(--filter-h));
}

/* ===== LEFT: CONTENT PANEL ===== */
.tools-content-panel {
  padding: 24px 20px;
  border-right: 1px solid var(--border);
}

/* Empty state */
.content-empty {
  height: 100%;
  min-height: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--muted);
  text-align: center;
}
.content-empty-icon { font-size: 3rem; opacity: .35; }
.content-empty-title { font-size: 1rem; font-weight: 700; color: var(--text); opacity: .5; }
.content-empty-sub { font-size: .82rem; }

/* Speech bubble panel */
.tool-bubble-wrap {
  position: relative;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  animation: bubbleIn .22s cubic-bezier(.34,1.56,.64,1);
  display: none;
}
.tool-bubble-wrap.visible { display: block; }

/* Arrow pointing RIGHT toward sidebar */
.tool-bubble-wrap::before {
  content: '';
  position: absolute;
  right: -15px;
  top: var(--arrow-y, 60px);
  transform: translateY(-50%);
  border: 13px solid transparent;
  border-left: 13px solid var(--border);
  border-right: 0;
  pointer-events: none;
}
.tool-bubble-wrap::after {
  content: '';
  position: absolute;
  right: -12px;
  top: var(--arrow-y, 60px);
  transform: translateY(-50%);
  border: 12px solid transparent;
  border-left: 12px solid var(--white);
  border-right: 0;
  pointer-events: none;
}

@keyframes bubbleIn {
  from { opacity: 0; transform: translateX(18px) scale(.97); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}

/* Tool header inside bubble */
.bubble-tool-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
}
.bubble-tool-icon { font-size: 2rem; line-height: 1; }
.bubble-tool-name { font-size: 1.15rem; font-weight: 900; letter-spacing: -.02em; }
.bubble-tool-desc { font-size: .78rem; color: var(--muted); }
.bubble-close {
  margin-left: auto;
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 1.1rem; padding: 4px 8px;
  border-radius: 6px; line-height: 1;
}
.bubble-close:hover { background: var(--bg); }

/* Tool body */
.bubble-tool-body { padding: 20px 24px; }

/* Inputs */
.tool-input-row { margin-bottom: 14px; }
.tool-input-row label { display: block; font-size: .78rem; font-weight: 700; margin-bottom: 5px; }
.tool-input-row input,
.tool-input-row select {
  width: 100%; padding: 9px 12px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .9rem; font-family: inherit; color: var(--text); background: var(--white);
}
.tool-input-row input:focus, .tool-input-row select:focus {
  outline: none; border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.tool-input-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.with-unit { position: relative; }
.with-unit input { padding-right: 40px; }
.with-unit .unit {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: .8rem; color: var(--muted); font-weight: 600;
}
.rate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rate-btn {
  padding: 9px; border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--white); font-family: inherit; font-size: .85rem;
  font-weight: 700; color: var(--muted); cursor: pointer; transition: all .15s;
}
.rate-btn.on { border-color: var(--blue); background: var(--blue-lt); color: var(--blue); }
.calc-btn {
  width: 100%; padding: 12px; background: var(--blue); color: #fff;
  border: none; border-radius: 10px; font-family: inherit;
  font-size: .93rem; font-weight: 700; cursor: pointer; margin-top: 4px;
  transition: background .15s;
}
.calc-btn:hover { background: #1d4ed8; }

/* Result area */
.result-area { margin-top: 14px; display: none; }
.result-area.visible { display: block; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.result-item { background: var(--bg); border-radius: 10px; padding: 12px 14px; }
.result-item.span2 { grid-column: span 2; background: var(--blue-lt); }
.result-label { font-size: .68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.result-value { font-size: 1.3rem; font-weight: 900; color: var(--blue); }
.result-value .unit { font-size: .78rem; font-weight: 500; color: var(--muted); margin-left: 2px; }

/* World clock */
.clock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.clock-item { background: var(--bg); border-radius: 10px; padding: 10px 14px; }
.clock-item.target-input { background: var(--blue-lt); }
.clock-country { font-size: .72rem; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
.clock-time { font-size: 1.1rem; font-weight: 900; color: var(--text); letter-spacing: -.02em; }
.clock-time.target-time { color: var(--blue); }
.clock-date { font-size: .68rem; color: var(--muted); }

/* ===== CONTEXTUAL ADS ===== */
.contextual-ads {
  border-top: 1px solid var(--border);
  padding: 16px 24px 20px;
}
.ads-label {
  font-size: .65rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.ads-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.ad-banner {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: 10px; border: 1px solid var(--border);
  margin-bottom: 8px; background: var(--white);
  text-decoration: none; color: var(--text);
  transition: box-shadow .15s, border-color .15s;
  cursor: pointer;
}
.ad-banner:hover { box-shadow: var(--shadow); border-color: var(--blue-md); }
.ad-icon { font-size: 1.6rem; flex-shrink: 0; }
.ad-body { flex: 1; min-width: 0; }
.ad-title { font-size: .83rem; font-weight: 700; color: var(--text); }
.ad-sub { font-size: .72rem; color: var(--muted); }
.ad-pr {
  flex-shrink: 0;
  font-size: .6rem; font-weight: 700; letter-spacing: .06em;
  border-radius: 4px; padding: 2px 6px; color: #fff;
}
.ad-cta { font-size: .72rem; font-weight: 700; color: var(--blue); flex-shrink: 0; }

/* ===== RIGHT: TOOL LIST SIDEBAR ===== */
.tools-list-panel {
  position: sticky;
  top: calc(var(--header-h) + var(--filter-h));
  height: calc(100vh - var(--header-h) - var(--filter-h));
  overflow-y: auto;
  padding: 10px 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.list-section { margin-bottom: 16px; }
.list-section-label {
  font-size: .64rem; font-weight: 700; color: var(--muted);
  letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 8px; margin-bottom: 4px;
}

.list-tool-card {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 10px; border-radius: 10px;
  border: 1.5px solid transparent;
  cursor: pointer; text-decoration: none; color: var(--text);
  transition: all .15s; position: relative;
  margin-bottom: 2px; background: var(--white);
  border-color: var(--border);
}
.list-tool-card:hover { border-color: var(--blue-md); background: #EFF6FF; }
.list-tool-card.active {
  border-color: var(--blue);
  background: var(--blue-lt);
}
/* Left arrow on active card pointing left (toward the content panel) */
.list-tool-card.active::before {
  content: '';
  position: absolute;
  left: -13px;
  top: 50%;
  transform: translateY(-50%);
  border: 8px solid transparent;
  border-right: 8px solid var(--blue);
  border-left: 0;
}

.list-tool-card.hidden { display: none; }

.card-icon { font-size: 1.3rem; line-height: 1; flex-shrink: 0; }
.card-info { flex: 1; min-width: 0; }
.card-name { font-size: .83rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-desc { font-size: .68rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.list-section.section-hidden { display: none; }

/* ===== MOBILE BOTTOM SHEET ===== */
.sheet-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 400;
  opacity: 0; transition: opacity .3s;
}
.sheet-overlay.visible { opacity: 1; }

.mobile-sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--white);
  border-radius: 20px 20px 0 0;
  z-index: 500;
  max-height: 88vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
}
.mobile-sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 40px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 12px auto 4px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .tools-layout {
    grid-template-columns: 1fr;
  }
  .tools-content-panel { display: none; }
  .tools-list-panel {
    position: relative;
    top: 0;
    height: auto;
    overflow: visible;
    padding: 10px;
  }
  .sheet-overlay { display: block; pointer-events: none; }
  .sheet-overlay.visible { pointer-events: auto; }
}
@media (min-width: 769px) {
  .mobile-sheet { display: none; }
}
</style>
</head>

   ============================================= */

  const h = new Date().getHours();
  if (h >= 6  && h < 11) return 'morning';

/* =============================================
   CALCULATION FUNCTIONS
   ============================================= */
let taxRate = 10;
function setRate(r) {
  taxRate = r;
  document.getElementById('tax8').classList.toggle('on', r===8);
  document.getElementById('tax10').classList.toggle('on', r===10);
  calcTax();
}
function calcTax() {
  const amt = parseFloat(document.getElementById('taxAmt')?.value) || 0;
  const mode = document.getElementById('taxMode')?.value;
  const rate = taxRate / 100;
  let ex, tax, inc;
  if (mode === 'ex') { ex = amt; tax = Math.round(amt * rate); inc = ex + tax; }
  else { inc = amt; ex = Math.round(inc / (1 + rate)); tax = inc - ex; }
  const fmt = n => n.toLocaleString();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.innerHTML = `${fmt(v)}<span class="unit">円</span>`; };
  set('taxEx', ex); set('taxAmt2', tax); set('taxIn', inc);
}

function calcWarikan() {
  const total = parseFloat(document.getElementById('wTotal')?.value) || 0;
  const ppl = parseInt(document.getElementById('wPeople')?.value) || 1;
  const mode = document.getElementById('wRound')?.value || 'round';
  let per;
  if (mode === 'round') per = Math.round(total / ppl);
  else if (mode === 'ceil') per = Math.ceil(total / ppl);
  else per = Math.floor(total / ppl);
  const collect = per * ppl;
  const rem = Math.abs(collect - total);
  const fmt = n => n.toLocaleString();
  const set = (id, v, u) => { const el = document.getElementById(id); if(el) el.innerHTML=`${fmt(v)}<span class="unit">${u}</span>`; };
  set('wPer', per, '円'); set('wCollect', collect, '円'); set('wRem', rem, '円');
}

function calcLoan() {
  const P = (parseFloat(document.getElementById('lAmount')?.value) || 0) * 10000;
  const r = (parseFloat(document.getElementById('lRate')?.value) || 0) / 100 / 12;
  const n = (parseInt(document.getElementById('lYears')?.value) || 1) * 12;
  if (P <= 0 || n <= 0) return;
  const monthly = r > 0 ? P * r * Math.pow(1+r,n) / (Math.pow(1+r,n)-1) : P/n;
  const total = monthly * n;
  const interest = total - P;
  const set = (id, v, u) => { const el = document.getElementById(id); if(el) el.innerHTML=`${v}<span class="unit">${u}</span>`; };
  set('lMonthly', Math.round(monthly).toLocaleString(), '円');
  set('lTotal', (total/10000).toFixed(1), '万円');
  set('lInterest', (interest/10000).toFixed(1), '万円');
}

let clockInterval = null;
function startClock() {
  stopClock();
  const zones = [
    'Asia/Tokyo','America/New_York','Europe/London','Europe/Paris',
    'Australia/Sydney','Asia/Singapore','Asia/Dubai','America/Los_Angeles'
  ];
  function tick() {
    const now = new Date();
    zones.forEach(tz => {
      const key = tz.replace(/\//g,'-');
      const tel = document.getElementById('clk-'+key);
      const del = document.getElementById('clkd-'+key);
      if (!tel) return;
      tel.textContent = now.toLocaleTimeString('ja-JP', { timeZone: tz, hour:'2-digit', minute:'2-digit', second:'2-digit' });
      del.textContent = now.toLocaleDateString('ja-JP', { timeZone: tz, month:'short', day:'numeric', weekday:'short' });
    });
  }
  tick();
  clockInterval = setInterval(tick, 1000);
}
function stopClock() { if (clockInterval) { clearInterval(clockInterval); clockInterval = null; } }

let pwLen = 16;
function updatePwLen() { pwLen = parseInt(document.getElementById('pwLen')?.value||16); document.getElementById('pwLenVal').textContent=pwLen; }
function genPw() {
  const u=document.getElementById('pwUpper')?.checked;
  const l=document.getElementById('pwLower')?.checked;
  const n=document.getElementById('pwNum')?.checked;
  const s=document.getElementById('pwSym')?.checked;
  let chars=''; if(u) chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ'; if(l) chars+='abcdefghijklmnopqrstuvwxyz'; if(n) chars+='0123456789'; if(s) chars+='!@#$%^&*()-_=+[]{}';
  if(!chars) chars='abcdefghijklmnopqrstuvwxyz';
  const arr=new Uint32Array(pwLen); crypto.getRandomValues(arr);
  const pw=Array.from(arr).map(v=>chars[v%chars.length]).join('');
  const el=document.getElementById('pwOutput'); if(el) el.textContent=pw;
}
function copyPw() {
  const pw=document.getElementById('pwOutput')?.textContent||'';
  navigator.clipboard?.writeText(pw).then(()=>{ const el=document.getElementById('pwOutput'); if(el){el.style.background='var(--blue-lt)'; setTimeout(()=>el.style.background='',800); }});
}

/* =============================================
   OPEN / CLOSE TOOL
   ============================================= */
let activeToolId = null;
let activeCardEl = null;

function openTool(toolId, cardEl) {
  stopClock();
  activeToolId = toolId;
  const tool = TOOLS.find(t => t.id === toolId);
  if (!tool) return;

  // Highlight active card
  document.querySelectorAll('.list-tool-card').forEach(c => c.classList.remove('active'));
  cardEl.classList.add('active');
  activeCardEl = cardEl;

  const renderer = RENDERERS[toolId] || (() => RENDERERS.default(tool));
  const bodyHTML = typeof renderer === 'function' ? renderer(tool) : renderer;
  const ads = getAds(toolId);
  const slot = getSlot();

  const isMobile = window.innerWidth <= 768;

  if (isMobile) {
    // Mobile: bottom sheet
    document.getElementById('sheetIcon').textContent = tool.icon;
    document.getElementById('sheetName').textContent = tool.name;
    document.getElementById('sheetDesc').textContent = tool.desc;
    document.getElementById('sheetBody').innerHTML = bodyHTML;
    const sheetAds = document.getElementById('sheetAds');
    sheetAds.innerHTML = renderAds(ads, slot);
    sheetAds.style.display = 'block';
    document.getElementById('mobileSheet').classList.add('open');
    document.getElementById('sheetOverlay').classList.add('visible');
  } else {
    // Desktop: bubble panel
    const bubble = document.getElementById('toolBubble');
    document.getElementById('emptyState').style.display = 'none';

    document.getElementById('bubbleIcon').textContent = tool.icon;
    document.getElementById('bubbleName').textContent = tool.name;
    document.getElementById('bubbleDesc').textContent = tool.desc;
    document.getElementById('bubbleBody').innerHTML = bodyHTML;

    const adsEl = document.getElementById('contextualAds');
    adsEl.innerHTML = renderAds(ads, slot);
    adsEl.style.display = 'block';

    // Speech bubble arrow Y position
    const panel = document.getElementById('contentPanel');
    const cardRect = cardEl.getBoundingClientRect();
    const panelRect = panel.getBoundingClientRect();
    const arrowY = cardRect.top + cardRect.height / 2 - panelRect.top + panel.scrollTop;
    bubble.style.setProperty('--arrow-y', Math.max(40, Math.min(arrowY, bubble.offsetHeight - 40)) + 'px');

    bubble.classList.remove('visible');
    void bubble.offsetWidth; // reflow for animation
    bubble.classList.add('visible');
  }

  // Init tool-specific logic
  if (toolId === 'tax')          { calcTax(); }
  if (toolId === 'warikan')      { calcWarikan(); }
  if (toolId === 'loan')         { calcLoan(); }
  if (toolId === 'world-clock')  { startClock(); }
  if (toolId === 'password')     { updatePwLen(); genPw(); }
}

function closeTool() {
  stopClock();
  document.querySelectorAll('.list-tool-card').forEach(c => c.classList.remove('active'));
  // Desktop
  document.getElementById('toolBubble').classList.remove('visible');
  document.getElementById('emptyState').style.display = '';
  // Mobile
  document.getElementById('mobileSheet').classList.remove('open');
  document.getElementById('sheetOverlay').classList.remove('visible');
  activeToolId = null;
  activeCardEl = null;
}

function buildToolList() {
  const container = document.getElementById('toolsList');
  const cats = ['global','money','datetime','text','design','health','fun'];
  container.innerHTML = cats.map(cat => {
    const tools = TOOLS.filter(t => t.cat === cat);
    return `
      <div class="list-section" data-section="${cat}">
        <div class="list-section-label">${SECTION_LABELS[cat]}</div>
        ${tools.map(t => `
          <div class="list-tool-card" data-category="${t.cat}" data-id="${t.id}" onclick="openTool('${t.id}', this)">
            <span class="card-icon">${t.icon}</span>
            <div class="card-info">
              <div class="card-name">${t.name}</div>
              <div class="card-desc">${t.desc}</div>
            </div>
          </div>`).join('')}
      </div>`;
  }).join('');
}

/* =============================================
   FILTER
   ============================================= */
document.querySelectorAll('#filterBar .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const filter = btn.dataset.filter;
    document.querySelectorAll('#filterBar .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    document.querySelectorAll('.list-section').forEach(sec => {
      const cards = sec.querySelectorAll('.list-tool-card');
      let visible = 0;
      cards.forEach(c => {
        const match = filter === 'all' || c.dataset.category === filter;
        c.classList.toggle('hidden', !match);
        if (match) visible++;
      });
      sec.classList.toggle('section-hidden', visible === 0);
    });

    // Close tool if it's filtered out
    if (activeToolId && filter !== 'all') {
      const tool = TOOLS.find(t => t.id === activeToolId);
      if (tool && tool.cat !== filter) closeTool();
    }
  });
});

/* =============================================

   ============================================= */
buildToolList();
