---
layout: default
---
<article>
  <div class="post-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="back-link">← 記事一覧に戻る</a>
      <div class="post-meta">
        <span class="post-tag">REVIEW</span>
        <span class="post-date">{{ page.date | date: "%Y年%m月%d日" }}</span>
      </div>
      <h1 class="post-title">{{ page.title }}</h1>
    </div>
  </div>
  <div class="container">
    <div class="post-content">
      {{ content }}
      <div class="cta-banner">
        <h3>AIツール・副業の最新レビューを随時更新中</h3>
        <p>sambleparker ではAIツール・副業・ライフスタイルの本音レビューを発信しています。</p>
        <a href="{{ '/' | relative_url }}" class="btn">他の記事も読む</a>
      </div>
    </div>
  </div>
</article>
