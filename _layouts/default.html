<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="6Qwa0FA5N2vR2nP44qoL5Tu5xaOoxwVvAQ-mE9r6MfA" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}ToolsLab. by sambleparker</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:locale" content="ja_JP">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
  <meta name="twitter:card" content="{% if page.image %}summary_large_image{% else %}summary{% endif %}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="logo">
        <span class="logo-badge">✳</span><span class="logo-main">ToolsLab<span class="logo-dot">.</span></span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">レビュー</a>
        <a href="{{ '/#tools' | relative_url }}">ツール</a>
      </nav>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <span class="logo-badge" style="font-size:.7rem;padding:2px 8px;">✳</span>
          <span>ToolsLab. <span style="font-weight:400;font-size:.8rem;opacity:.5">by sambleparker</span></span>
        </div>
        <div class="footer-links">
          <a href="{{ '/' | relative_url }}">レビュー一覧</a>
          <a href="{{ '/#tools' | relative_url }}">ツール</a>
          <a href="https://note.com/tools_aria" target="_blank" rel="noopener">デジタル製品（note）</a>
        </div>
      </div>
      <p class="footer-copy">本サイトはアフィリエイト広告を利用しています &nbsp;|&nbsp; Operated by <strong>ToolsLab.ARIA</strong> &nbsp;|&nbsp; &copy; 2026 ToolsLab.ARIA All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
