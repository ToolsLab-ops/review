<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="google93f3e4d8a01ab661" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}ToolsLab. by sambleparker</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="logo">
        <span class="logo-badge">✳</span><span class="logo-main">ToolsLab<span class="logo-dot">.</span></span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">レビュー</a>
      </nav>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <span class="logo-badge" style="font-size:.7rem;padding:2px 8px;">✳</span>
          <span>ToolsLab. <span style="font-weight:400;font-size:.8rem;opacity:.5">by sambleparker</span></span>
        </div>
        <div class="footer-links">
          <a href="{{ '/' | relative_url }}">レビュー一覧</a>
        </div>
      </div>
      <p class="footer-copy">本サイトはアフィリエイト広告を利用しています &nbsp;|&nbsp; Operated by <strong>ToolsLab.ARIA</strong> &nbsp;|&nbsp; &copy; 2026 ToolsLab.ARIA All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
